info:
  name: Get User Profile
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/users/{{userId}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("returns the public profile", function () {
          expect(res.status).to.equal(200);
          expect(res.body.id).to.equal(bru.getVar("userId"));
          expect(res.body.username).to.equal(bru.getVar("username"));
          expect(res.body.createdAt).to.be.a("string");
        });
        test("hides private fields", function () {
          expect(res.body).to.not.have.property("email");
          expect(res.body).to.not.have.property("passwordHash");
        });

settings:
  encodeUrl: true

docs: |-
  `GET /api/users/:id` — public profile for the user created by **Register**
  (`{{userId}}`). No authentication required.
