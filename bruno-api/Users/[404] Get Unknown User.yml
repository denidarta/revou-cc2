info:
  name: "[404] Get Unknown User"
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/users/00000000-0000-0000-0000-000000000000"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
  scripts:
    - type: tests
      code: |-
        test("returns 404 for an unknown user", function () {
          expect(res.status).to.equal(404);
          expect(res.body.statusCode).to.equal(404);
        });

settings:
  encodeUrl: true

docs: |-
  Negative case: an id that does not match any user returns `404 Not Found`.
