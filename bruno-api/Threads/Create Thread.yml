info:
  name: Create Thread
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/threads"
  headers:
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{token}}"
  body:
    type: json
    data: |-
      {
        "title": "How do I set up environment variables?",
        "content": "I keep leaking API keys. How do I use dotenv?"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 && res.body && res.body.id) {
          bru.setVar("threadId", res.body.id);
        }
    - type: tests
      code: |-
        test("creates a thread owned by the current user", function () {
          expect(res.status).to.equal(201);
          expect(res.body.id).to.be.a("string");
          expect(res.body.title).to.equal("How do I set up environment variables?");
          expect(res.body.content).to.equal("I keep leaking API keys. How do I use dotenv?");
        });
        test("attributes the thread to the authenticated author", function () {
          expect(res.body.author).to.deep.equal({
            id: bru.getVar("userId"),
            username: bru.getVar("username")
          });
        });

settings:
  encodeUrl: true

docs: |-
  `POST /api/threads` (auth required) — creates a thread owned by the caller and
  returns it with its `author` (`{ id, username }`).

  Stores the new thread id in `{{threadId}}`. Requires `title` 3–200 chars and
  `content` 10–5000 chars.
