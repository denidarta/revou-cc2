info:
  name: List My Threads
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/threads/my-threads"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("returns the current user's threads", function () {
          expect(res.status).to.equal(200);
          expect(res.body).to.be.an("array");
          const ids = res.body.map((thread) => thread.id);
          expect(ids).to.include(bru.getVar("threadId"));
        });

settings:
  encodeUrl: true

docs: |-
  `GET /api/threads/my-threads` (auth required) — an unpaginated array of only
  the caller's threads. Returns `401` without a valid token.
