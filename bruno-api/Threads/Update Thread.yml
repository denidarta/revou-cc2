info:
  name: Update Thread
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/api/threads/{{threadId}}"
  headers:
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{token}}"
  body:
    type: json
    data: |-
      {
        "title": "Updated: how do I set up environment variables?",
        "content": "Switched to a dotenv-driven config and rotated the exposed keys."
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("updates the owner's thread", function () {
          expect(res.status).to.equal(200);
          expect(res.body.id).to.equal(bru.getVar("threadId"));
          expect(res.body.title).to.equal("Updated: how do I set up environment variables?");
          expect(res.body.content).to.equal("Switched to a dotenv-driven config and rotated the exposed keys.");
          expect(res.body.updatedAt).to.be.a("string");
        });

settings:
  encodeUrl: true

docs: |-
  `PUT /api/threads/:id` (owner only) — replaces `title` and `content`. A
  non-owner receives `403`; an unknown id `404`.
