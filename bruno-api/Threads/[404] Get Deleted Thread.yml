info:
  name: "[404] Get Deleted Thread"
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/threads/{{threadId}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
  scripts:
    - type: tests
      code: |-
        test("the deleted thread is gone", function () {
          expect(res.status).to.equal(404);
          expect(res.body.statusCode).to.equal(404);
        });

settings:
  encodeUrl: true

docs: |-
  Behaviour check for **Delete Thread**: fetching the same `{{threadId}}` now
  returns `404 Not Found` instead of the deleted thread.
