info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "password": "{{password}}"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: after-response
      code: |-
        // Runtime variable: held in memory for this run only.
        if (res.status === 200 && res.body && res.body.accessToken) {
          bru.setVar("token", res.body.accessToken);
        }
    - type: tests
      code: |-
        test("returns 200 with an access token", function () {
          expect(res.status).to.equal(200);
          expect(res.body.accessToken).to.be.a("string");
          expect(res.body.accessToken).to.not.be.empty;
        });

settings:
  encodeUrl: true

docs: |-
  `POST /api/auth/login` — exchanges the credentials generated by **Register**
  for a JWT and stores it in `{{token}}`.

  Run **Register** first; otherwise `{{email}}` is empty and this returns
  `400`. Wrong credentials return `401`.
